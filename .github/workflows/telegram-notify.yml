name: Telegram Repo Alerts

on:
  push:
  create:
  delete:
  commit_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize, closed, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited]
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created]
  release:
    types: [published, created]
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Compose Telegram message
        id: build
        run: |
          EVENT="${{ github.event_name }}"
          ACTION=$(jq -r '.action // empty' "$GITHUB_EVENT_PATH")
          REPO="${{ github.repository }}"
          ACTOR="${{ github.actor }}"
          REF="${{ github.ref }}"
          REF_TYPE=$(jq -r '.ref_type // empty' "$GITHUB_EVENT_PATH")
          REF_NAME=$(jq -r '.ref // empty' "$GITHUB_EVENT_PATH")
          SHA="${{ github.sha }}"
          COMPARE_URL="${{ github.event.compare }}"
          HTML_URL=$(jq -r '.pull_request.html_url // .issue.html_url // .comment.html_url // .release.html_url // .repository.html_url // empty' "$GITHUB_EVENT_PATH")
          TITLE=$(jq -r '.pull_request.title // .issue.title // .release.name // empty' "$GITHUB_EVENT_PATH")
          PR_NUM=$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")
          ISSUE_NUM=$(jq -r '.issue.number // empty' "$GITHUB_EVENT_PATH")
          COMMENT_BODY=$(jq -r '.comment.body // empty' "$GITHUB_EVENT_PATH")
          COMMIT_MSG=$(jq -r '.head_commit.message // empty' "$GITHUB_EVENT_PATH")
          BRANCH="${REF#refs/heads/}"

          case "$EVENT" in
            push)
              HEADER="🔔 PUSH"
              LINK="${COMPARE_URL:-$HTML_URL}"
              LINES=("repo: ${REPO}" "branch: ${BRANCH:-$REF}" "by: ${ACTOR}" "sha: ${SHA:0:7}")
              [ -n "$COMMIT_MSG" ] && LINES+=("• $(printf '%s' "$COMMIT_MSG" | head -n1)")
              ;;
            commit_comment)
              HEADER="💬 COMMIT COMMENT"
              LINK="$HTML_URL"
              LINES=("repo: ${REPO}" "by: ${ACTOR}" "comment: $(printf '%s' "$COMMENT_BODY" | head -n1)")
              ;;
            pull_request)
              HEADER="🔀 PR ${ACTION^^}"
              LINK="$HTML_URL"
              LINES=("repo: ${REPO}" "by: ${ACTOR}")
              [ -n "$PR_NUM" ] && LINES+=("PR #${PR_NUM}")
              [ -n "$TITLE" ] && LINES+=("• ${TITLE}")
              ;;
            pull_request_review)
              STATE=$(jq -r '.review.state // empty' "$GITHUB_EVENT_PATH")
              HEADER="📝 PR REVIEW ${STATE^^}"
              LINK="$HTML_URL"
              LINES=("repo: ${REPO}" "by: ${ACTOR}")
              [ -n "$PR_NUM" ] && LINES+=("PR #${PR_NUM}")
              ;;
            pull_request_review_comment)
              HEADER="💬 PR REVIEW COMMENT"
              LINK="$HTML_URL"
              LINES=("repo: ${REPO}" "by: ${ACTOR}")
              [ -n "$PR_NUM" ] && LINES+=("PR #${PR_NUM}")
              [ -n "$TITLE" ] && LINES+=("• ${TITLE}")
              [ -n "$COMMENT_BODY" ] && LINES+=("comment: $(printf '%s' "$COMMENT_BODY" | head -n1)")
              ;;
            issues)
              HEADER="🧩 ISSUE ${ACTION^^}"
              LINK="$HTML_URL"
              LINES=("repo: ${REPO}" "by: ${ACTOR}")
              [ -n "$ISSUE_NUM" ] && LINES+=("Issue #${ISSUE_NUM}")
              [ -n "$TITLE" ] && LINES+=("• ${TITLE}")
              ;;
            issue_comment)
              HEADER="💬 ISSUE COMMENT"
              LINK="$HTML_URL"
              LINES=("repo: ${REPO}" "by: ${ACTOR}")
              [ -n "$ISSUE_NUM" ] && LINES+=("Issue #${ISSUE_NUM}")
              [ -n "$TITLE" ] && LINES+=("• ${TITLE}")
              [ -n "$COMMENT_BODY" ] && LINES+=("comment: $(printf '%s' "$COMMENT_BODY" | head -n1)")
              ;;
            release)
              HEADER="🏷️ RELEASE ${ACTION^^}"
              LINK="$HTML_URL"
              LINES=("repo: ${REPO}" "by: ${ACTOR}")
              [ -n "$TITLE" ] && LINES+=("• ${TITLE}")
              ;;
            create|delete)
              HEADER=$([ "$EVENT" = create ] && echo "🌱 CREATE ${REF_TYPE^^}" || echo "🗑️ DELETE ${REF_TYPE^^}")
              LINK="$HTML_URL"
              LINES=("repo: ${REPO}" "${REF_TYPE}: ${REF_NAME}" "by: ${ACTOR}")
              ;;
            *)
              HEADER="🔔 ${EVENT^^} ${ACTION^^}"
              LINK="$HTML_URL"
              LINES=("repo: ${REPO}" "by: ${ACTOR}")
              ;;
          esac

          MSG="${HEADER}"
          for L in "${LINES[@]}"; do MSG="${MSG}\n${L}"; done
          [ -n "$LINK" ] && MSG="${MSG}\n🔗 ${LINK}"

          # экранируем HTML
          ESCAPED=$(printf "%s" "$MSG" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')
          echo "text=$ESCAPED" >> $GITHUB_OUTPUT

      - name: Send to Telegram
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            --data-urlencode "text=${{ steps.build.outputs.text }}"
